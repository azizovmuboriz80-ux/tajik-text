name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK with fixed Action
        uses: diggmcchesney/buildozer-action@v2.1.1
        with:
          command: buildozer android debug
          buildozer_version: stable
          python_version: python3.10
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tajik-AI-APK
          path: bin/*.apk